name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codepulse-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    uses: randy-labs/ship/.github/workflows/reusable-python-node-ci.yml@bbcd7a7a60aaf5832f11becf7028a2bca3e509f5
    with:
      python-versions: '["3.11", "3.12"]'
      frontend-enabled: true
      sparse-checkout: |
        /*
        !/article/
