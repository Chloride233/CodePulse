name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codepulse-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    uses: randy-labs/ship/.github/workflows/reusable-python-node-ci.yml@a2d6efd39bdd1620be5cc51b771fed0f751ee214
    with:
      python-versions: '["3.11", "3.12"]'
      frontend-enabled: true
      sparse-checkout: |
        /*
        !/article/
