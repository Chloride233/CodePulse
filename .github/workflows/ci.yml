name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codepulse-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    uses: randy-labs/ship/.github/workflows/reusable-python-node-ci.yml@d7c4c2bd9a752be62feca98d0d2f9cf1e20d214b
    with:
      python-versions: '["3.11", "3.12"]'
      frontend-enabled: true
