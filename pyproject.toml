[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codepulse"
version = "0.1.0"
description = "Code Agent 评测与自进化框架"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Chloride233", email = "chloride@example.com" },
]
keywords = ["code-agent", "evaluation", "benchmark", "self-evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "litellm>=1.30.0",
    "docker>=7.0.0",
    "lancedb>=0.6.0",
    "jinja2>=3.1.3",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0",
]

[project.scripts]
codepulse = "codepulse.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "numpy<2.5",
    "bandit>=1.7.7",
    "pre-commit>=3.6.0",
    "types-docker>=7.1.0",
    "types-PyYAML>=6.0.0",
]
swebench = [
    "swebench==4.1.0",
]

[project.urls]
Homepage = "https://github.com/Chloride233/CodePulse"
Repository = "https://github.com/Chloride233/CodePulse"
Documentation = "https://github.com/Chloride233/CodePulse#readme"

[tool.hatch.build.targets.wheel]
packages = ["codepulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=codepulse",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=60",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests that require LLM API calls",
]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["codepulse"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert is allowed in tests
